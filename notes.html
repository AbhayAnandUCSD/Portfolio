<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Abhay Anand — graduate student at UC San Diego. Spatial intelligence, world models, interpretability." />
  <title>Abhay Anand</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var theme = stored === 'dark' || stored === 'light'
          ? stored
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <!-- Vercel Web Analytics -->
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
<a class="brand" href="/">Abhay Anand</a>
      <nav class="nav" aria-label="Sections">
        <a href="/projects">Projects</a>
        <a href="/notes" aria-current="page">Notes</a>
      </nav>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle theme">
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg>
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" /></svg>
      </button>
    </div>
  </header>

  <main class="wide">
      <section id="notes" aria-label="Notes">
        <h1 class="page-title">Notes</h1>
        <div class="note-list" id="note-list"></div>
      </section>
  </main>

  <script>
  (function () {
    var root = document.documentElement;
    var btn = document.getElementById('theme-toggle');
    btn.setAttribute('aria-pressed', root.getAttribute('data-theme') === 'dark');
    btn.addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
      btn.setAttribute('aria-pressed', next === 'dark');
    });
  })();
  </script>
  <script>
  (function () {
    // ---- edit notes here ----------------------------------------------
    var NOTES = [
      { title: 'Getting started with Research', date: 'Oct 2026', href: '/notes/researchmap' },
      // Hidden for now — restore by uncommenting.
      // { title: 'SimpleResume', date: 'May 2026', href: '/simpleresume/' }
    ];
    // -------------------------------------------------------------------
    document.getElementById('note-list').innerHTML = NOTES.map(function (n) {
      return '<a class="note-row" href="' + n.href + '">' +
        '<span class="note-title">' + n.title + '</span>' +
        '<span class="note-date">' + n.date + '</span></a>';
    }).join('');
  })();
  </script>
</body>
</html>
